name: Publish Release

on:
  workflow_dispatch:

env:
  LIVE_DATA_REPO_NAME: data-sectorfiles
  LIVE_DATA_REF: main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout package repo
        uses: actions/checkout@v6

      - name: Mint live-data access token
        id: live-data-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.LIVE_DATA_APP_ID }}
          private-key: ${{ secrets.LIVE_DATA_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.LIVE_DATA_REPO_NAME }}

      - name: Checkout live data (private)
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/${{ env.LIVE_DATA_REPO_NAME }}
          ref: ${{ env.LIVE_DATA_REF }}
          token: ${{ steps.live-data-token.outputs.token }}
          path: .live-data
          persist-credentials: false

      - name: Sync sector files (ESE / SCT)
        run: |
          set -euo pipefail
          # ESE/SCT live at the live-data repo root with AIRAC-rotating names
          # (e.g. LFXX-LFXX_20260321145023-260301-0002.{ese,sct}). We rename
          # them to stable paths (sector_files/LFXX.{ese,sct,sct2}) so diffs
          # can target predictable filenames across AIRACs.
          rm -f sector_files/*.ese sector_files/*.sct sector_files/*.sct2
          shopt -s nullglob
          ese_files=(.live-data/*.ese)
          sct_files=(.live-data/*.sct)
          sct2_files=(.live-data/*.sct2)
          if [ ${#ese_files[@]} -ne 1 ]; then
            echo "::error::Expected exactly one .ese at live-data root, found ${#ese_files[@]}"
            exit 1
          fi
          if [ ${#sct_files[@]} -gt 1 ] || [ ${#sct2_files[@]} -gt 1 ]; then
            echo "::error::Expected at most one .sct and one .sct2 at live-data root"
            exit 1
          fi
          if [ ${#sct_files[@]} -eq 0 ] && [ ${#sct2_files[@]} -eq 0 ]; then
            echo "::error::No .sct/.sct2 file found at the root of the live-data repo"
            exit 1
          fi
          cp "${ese_files[0]}" sector_files/LFXX.ese
          [ ${#sct_files[@]}  -eq 1 ] && cp "${sct_files[0]}"  sector_files/LFXX.sct
          [ ${#sct2_files[@]} -eq 1 ] && cp "${sct2_files[0]}" sector_files/LFXX.sct2
          echo "Sector files now in package:"
          ls -la sector_files/

      - name: Sync data files & apply replacements
        run: python3 transforms/apply.py .live-data

      - name: Apply diffs
        run: |
          set -euo pipefail
          if [ ! -d diffs ]; then
            echo "No diffs directory; skipping."
            exit 0
          fi
          mapfile -t patches < <(find diffs -type f -name '*.patch' | sort)
          if [ "${#patches[@]}" -eq 0 ]; then
            echo "No patches to apply."
            exit 0
          fi
          for p in "${patches[@]}"; do
            echo "::group::Applying $p"
            git apply --whitespace=fix --verbose "$p"
            echo "::endgroup::"
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install neoradar CLI
        # neoradar-cli@1.1.0+ requires Node >=24 and pnpm >=10. pnpm refuses
        # to `add -g` unless its global bin dir is already on PATH, so we
        # add PNPM_HOME to PATH for this step *and* persist it via
        # GITHUB_ENV/GITHUB_PATH so `neoradar-cli` is reachable in later steps.
        run: |
          export PNPM_HOME="$HOME/.local/share/pnpm"
          mkdir -p "$PNPM_HOME"
          export PATH="$PNPM_HOME:$PATH"
          echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"
          echo "$PNPM_HOME" >> "$GITHUB_PATH"
          pnpm add -g github:neoradar-project/cli

      - name: Configure AWS credentials
        run: |
          mkdir -p ~/.aws
          echo "${{ secrets.AWS_PUBLISH_CREDENTIALS }}" > ~/.aws/credentials

      - name: Build airways database
        run: neoradar-cli build-airways .live-data/LFXX/NavData -o ./package/datasets/airways.db

      - name: Convert SCT/ESE/ICAO/aliases
        run: neoradar-cli convert ./ <<< y

      - name: Compute version
        id: vars
        run: echo "version=$(cat VERSION)_${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Distribute & publish
        run: neoradar-cli distribute --new-version "${{ steps.vars.outputs.version }}" --publish ./

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: lfxx-${{ steps.vars.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error
