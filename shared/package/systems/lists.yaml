# The CDM departures split in two short lists: NOW holds what needs doing (start-up within 10
# minutes, ready, suspended, expired) and what has started; LATER the rest. TIME names the time
# that matters (TOBT, TSAT, then TTOT), # is the take-off order (sort by it), CDM the status.
- name: VIFF CDM NOW
  filterExpressions:
    ["AND", [["==", "isMyDeparture", "1"], ["==", "onGround", "1"], ["OR", [["==", "plugin:vIFF CDM:EXP_Stage", "now"], ["==", "plugin:vIFF CDM:EXP_Stage", "started"]]]]]
  style:
    # CoFrance's list colours (CoFrance.toml ui_bg / ui_list_bg), nearly opaque: a clear list
    # let the map show through and its text, unconcerned grey especially, could not be read.
    background:
      headerColor: [43, 51, 54]
      headerOpacity: 0.95
      bodyColor: [41, 57, 59]
      bodyOpacity: 0.9
      rowColor: ["=focusedAircraft"]
    headerTextSize: 11
    headerOnlyBorder: true
    bodyTextSize: 11
  columns:
    - name: sts
      widthChars: 4
      tagItem:
        itemName: groundStatus
        mapping:
          0: ""
          1: "STUP"
          2: "PUSH"
          3: "TAXI"
          4: "DEPA"
        leftClick: groundStatusMenu
    - name: c/s
      widthChars: 8
      tagItem:
        itemName: callsign
        textAlign: left
        color: |
          =colourInboundTransfer
          =colourOutboundTransfer
          =colourAssumed
          =colourConcerned
          =colourUnconcerned
        leftClick: callsignMenu
    - name: sid
      widthChars: 7
      tagItem:
        itemName: text
        value:
          - =suggestedSidIfNoAssigned
          - |
            &sid
        color:
          - =suggestedSidColor
          - =blueAssignedSid
        leftClick: sidMenu
        placeholder: "----"
    - name: rwy
      widthChars: 3
      tagItem:
        itemName: text
        value:
          - =suggestedDepRunwayIfNoAssigned
          - |
            &depRunway
        color:
          - =suggestedDepRunwayColor
          - =blueDepRunway
        leftClick: sidMenu
        placeholder: "---"
    - name: assr
      widthChars: 4
      tagItem:
        itemName: text
        value:
          - =emptyIfNoAssignedSquawk
          - |
            &assignedSquawk
        placeholder: "----"
        color: "=incorrectSquawkYellowColor"
        leftClick: assignRandomSquawk
        rightClick: assignSq1000
    - name: D
      widthChars: 2
      tagItem:
        itemName: datalinkStatus
        color:
          - =pdcRequestedColour
          - =receivedMessageColour
          - =rejectedColour
          - =acknowledgmentColour
          - =sentMessageColour
          - =defaultDatalinkColour
        blinkColor: ["=pdcRequestedTextBlinkColour"]
        leftClick: pdcMenu
    - name: e
      widthChars: 2
      tagItem:
        itemName: clearanceIssued
        placeholder: ":fa-regular fa-square"
        mapping:
          0: ":fa-regular fa-square"
          1: ":fa-solid fa-square"
        color: [255, 174, 23]
        leftClick: toggleClearanceFlag
    - name: "#"
      widthChars: 2
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_SEQ"
    - name: TIME
      widthChars: 9
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_TIME"
        textAlign: left
        leftClick: "plugin:vIFF CDM:ACTION_TOBT Menu"
        rightClick: "plugin:vIFF CDM:ACTION_CDM Menu"
    - name: CTOT
      widthChars: 4
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_CTOT"
        leftClick: "plugin:vIFF CDM:ACTION_CTOT Menu"
        rightClick: "plugin:vIFF CDM:ACTION_CTOT Menu"
    - name: CDM
