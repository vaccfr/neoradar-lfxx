        blinkColor: ["=pdcRequestedTextBlinkColour"]
        leftClick: pdcMenu
    - name: e
      widthChars: 2
      tagItem:
        itemName: clearanceIssued
        placeholder: ":fa-regular fa-square"
        mapping:
          0: ":fa-regular fa-square"
          1: ":fa-solid fa-square"
        color: [255, 174, 23]
        leftClick: toggleClearanceFlag
    - name: TIME
      widthChars: 5
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_TIME S"
        textAlign: left
        leftClick: "plugin:vIFF CDM:ACTION_TOBT Menu"
        rightClick: "plugin:vIFF CDM:ACTION_CDM Menu"
    - name: CTOT
      widthChars: 4
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_CTOT"
        leftClick: "plugin:vIFF CDM:ACTION_CTOT Menu"
        rightClick: "plugin:vIFF CDM:ACTION_CTOT Menu"
    - name: CDM
      widthChars: 4
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_STATUS"
        leftClick: "plugin:vIFF CDM:ACTION_RDY"
        rightClick: "plugin:vIFF CDM:ACTION_RDY REA"

# Your departures with a CTOT or a suspended flight plan, whatever regulation set it (vIFF CDM).
- name: VIFF ATFCM
  filterExpressions:
    ["AND", [["==", "isMyDeparture", "1"], ["==", "onGround", "1"], ["OR", [["==", "plugin:vIFF CDM:EXP_Has CTOT", "1"], ["==", "plugin:vIFF CDM:EXP_Suspended", "1"]]]]]
  style:
    # CoFrance's list colours (CoFrance.toml ui_bg / ui_list_bg), nearly opaque: a clear list
    # let the map show through and its text, unconcerned grey especially, could not be read.
    background:
      headerColor: [43, 51, 54]
      headerOpacity: 0.95
      bodyColor: [41, 57, 59]
      bodyOpacity: 0.9
      rowColor: ["=focusedAircraft"]
    headerTextSize: 11
    headerOnlyBorder: true
    bodyTextSize: 11
  columns:
    - name: c/s
      width: 80
      tagItem:
        itemName: callsign
        color: |
          =colourInboundTransfer
          =colourOutboundTransfer
          =colourAssumed
          =colourConcerned
          =colourUnconcerned
        leftClick: callsignMenu
    - name: adep
      width: 40
      tagItem:
        itemName: origin
        leftClick: fpDialog
    - name: ades
      width: 40
      tagItem:
        itemName: destination
        leftClick: fpDialog
    - name: TOBT
      width: 35
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_TOBT"
    - name: TSAT
      width: 35
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_TSAT"
    - name: TTOT
      width: 35
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_TTOT"
    - name: CTOT
      width: 35
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_CTOT"
    - name: REG
      width: 90
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_REG"
    - name: ETFMS
      width: 55
      tagItem:
        itemName: "plugin:vIFF CDM:TAG_ETFMS"
