# One departure list for a top-down position on a small screen, in place of DEPARTURE LIST and
# the CDM lists: the same flights as DEPARTURE LIST, every column as narrow as its content. Three
# groups: the flight (# take-off order, callsign, voice, ground status), the clearance (runway,
# SID, CFL, squawk, PDC, clearance flag) and CDM (TIME with a one-letter name: B TOBT, S TSAT,
# T TTOT, E EOBT; CTOT; CDM status). Sort by # for the departure sequence. Right click on TIME
# opens every CDM action.
- name: VIFF CDM TOPDOWN
  filterExpressions:
    ["AND", [["==", "isMyDeparture", "1"], ["==", "onGround", "1"]]]
