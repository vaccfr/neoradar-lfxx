# yaml-language-server: $schema=https://raw.githubusercontent.com/neoradar-project/schemas/main/systems/mapstyle.schema.json
inactiveSectorBackgroundColor: [42, 44, 48]
activeSectorBackgroundColor: [33, 33, 33]

neighborSectorBorderLineColor: [145, 82, 15]
neighborSectorBorderLineWidth: 2

extendedCenterlines:
  lengthNm: 23
  color: [101, 129, 101]
  lineWidth: 2
  thresholdOffsetNm: 2

  majorTickType: 'circle'
  majorTickSpacingNm: 3
  majorTickWidth: 50

layerStyles:
  fix:
    pointStyle:
      type: cross
      size: 6
      strokeColor: [83, 94, 78]
      fillColor: [83, 94, 78]
      rotation: 45

  vor:
    pointStyle:
      type: cross
      size: 4
      strokeColor: [83, 94, 78]
      fillColor: [83, 94, 78]
      rotation: 45

  ndb:
    pointStyle:
      type: cross
      size: 4
      strokeColor: [83, 94, 78]
      fillColor: [83, 94, 78]
      rotation: 45

# Route draw in CoFrance's route colours (CoFrance.toml [Route display colors]): a thin line,
# small crosses at the fixes, and labels on a dark plate so they stay readable over the map.
routeDraw:
  lineStyle:
    color: [160, 216, 180]
    width: 1
    opacity: 0.85
  pointStyle:
    type: cross
    size: 3
    strokeColor: [160, 216, 180]
    strokeWidth: 1
    fillOpacity: 0
  textStyle:
    color: [160, 216, 180]
    fontFamily: EuroScope
    fontSize: 11
    lineHeight: 11
    offset: [6, -6]
    backgroundColor: [45, 48, 54]
    backgroundOpacity: 0.85
    padding: 2

# Radio direction finder: the circle drawn round an aircraft while it transmits.
rdf:
  circleRadius: 10
  circlePrecision: 0
  lowPrecision: 0
  highPrecision: 0
  singleTransmissionColor: [170, 231, 197, 255]
  concurrentTransmissionColor: [255, 0, 0, 255]
  circleThreshold: 10
  lowAltitude: 3000
  highAltitude: 41100
